{{- range $i := until 3 }}
{{- $name := printf "sentinel-%d" (add $i 1) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: sentinel
          image: redis:7-alpine
          command: ["sh", "-c"]
          args:
            - |
              PRIMARY_IP=$$(getent hosts redis-primary | cut -d ' ' -f 1)
              echo 'port 26379' > /tmp/sentinel.conf
              echo "sentinel monitor mymaster $$PRIMARY_IP 6379 2" >> /tmp/sentinel.conf
              echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf
              echo 'sentinel failover-timeout mymaster 2000' >> /tmp/sentinel.conf
              echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf
              echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf
              redis-sentinel /tmp/sentinel.conf
          ports:
            - containerPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  ports:
    - port: 26379
      targetPort: 26379
  selector:
    app: {{ $name }}
{{- end }}
