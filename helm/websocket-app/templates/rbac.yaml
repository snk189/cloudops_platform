apiVersion: v1
kind: ServiceAccount
metadata:
  name: websocket-app-sa
  namespace: {{ .Values.namespace }}
  labels:
    app: websocket-node
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: websocket-app-role
  namespace: {{ .Values.namespace }}
rules:
  # Allow reading configmaps (for runtime config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Allow reading own pod info (for health checks & topology)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: websocket-app-rolebinding
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: websocket-app-sa
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: websocket-app-role
