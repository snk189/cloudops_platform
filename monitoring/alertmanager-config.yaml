# Alertmanager config — deployed as a Secret by kube-prometheus-stack.
# Route: critical → Slack (or webhook), warning → just log.
# Replace YOUR_SLACK_WEBHOOK_URL with an actual incoming webhook.
global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK_URL"

route:
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "slack-critical"
  routes:
    - match:
        severity: critical
      receiver: "slack-critical"
    - match:
        severity: warning
      receiver: "slack-warning"
    - match:
        severity: info
      receiver: "null"

receivers:
  - name: "null"
  - name: "slack-critical"
    slack_configs:
      - channel: "#alerts-critical"
        title: "🚨 [CRITICAL] {{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"
        send_resolved: true
  - name: "slack-warning"
    slack_configs:
      - channel: "#alerts-warning"
        title: "⚠️ [WARNING] {{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "namespace"]
