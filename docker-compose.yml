services:
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  app:
    build: .
    environment:
      - NODE_ENV=development
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3

  redis-primary:
    image: redis:7-alpine
    command: redis-server --appendonly yes

  redis-replica:
    image: redis:7-alpine
    command: redis-server --replicaof redis-primary 6379 --appendonly yes
    depends_on:
      - redis-primary

  sentinel-1:
    image: redis:7-alpine
    command: >
      sh -c "PRIMARY_IP=$$(getent hosts redis-primary | cut -d ' ' -f 1) &&
      echo 'port 26379' > /tmp/sentinel.conf &&
      echo \"sentinel monitor mymaster $$PRIMARY_IP 6379 2\" >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 2000' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-primary
      - redis-replica

  sentinel-2:
    image: redis:7-alpine
    command: >
      sh -c "PRIMARY_IP=$$(getent hosts redis-primary | cut -d ' ' -f 1) &&
      echo 'port 26379' > /tmp/sentinel.conf &&
      echo \"sentinel monitor mymaster $$PRIMARY_IP 6379 2\" >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 2000' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-primary
      - redis-replica

  sentinel-3:
    image: redis:7-alpine
    command: >
      sh -c "PRIMARY_IP=$$(getent hosts redis-primary | cut -d ' ' -f 1) &&
      echo 'port 26379' > /tmp/sentinel.conf &&
      echo \"sentinel monitor mymaster $$PRIMARY_IP 6379 2\" >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 2000' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-primary
      - redis-replica

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis-primary
