apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: websocket-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-operations-cluster-role
rules:
- apiGroups: ["", "apps", "batch"]
  resources: ["pods", "deployments", "statefulsets", "services", "nodes", "persistentvolumes", "persistentvolumeclaims", "configmaps", "secrets", "events", "jobs"]
  verbs: ["get", "list", "watch", "update", "patch", "delete", "create"]
- apiGroups: [""]
  resources: ["pods/exec", "pods/log"]
  verbs: ["get", "create"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-operations-cluster-binding
subjects:
- kind: ServiceAccount
  name: app-service-account
  namespace: websocket-app
roleRef:
  kind: ClusterRole
  name: app-operations-cluster-role
  apiGroup: rbac.authorization.k8s.io
