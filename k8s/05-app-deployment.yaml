apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: websocket-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: websocket-node
  template:
    metadata:
      labels:
        app: websocket-node
    spec:
      serviceAccountName: app-service-account
      containers:
      - name: app
        image: websocket-app:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: app-config
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
