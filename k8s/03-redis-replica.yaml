apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replica
  namespace: websocket-app
spec:
  serviceName: redis-replica
  replicas: 1
  selector:
    matchLabels:
      app: redis-replica
  template:
    metadata:
      labels:
        app: redis-replica
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--replicaof", "redis-primary", "6379", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica
  namespace: websocket-app
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-replica
