apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-to-redis
  namespace: websocket-app
spec:
  podSelector:
    matchLabels:
      app: redis-primary
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: admin-node
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-to-replica
  namespace: websocket-app
spec:
  podSelector:
    matchLabels:
      app: redis-replica
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: admin-node
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-to-sentinel
  namespace: websocket-app
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - sentinel-1
      - sentinel-2
      - sentinel-3
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: admin-node
    ports:
    - protocol: TCP
      port: 26379
