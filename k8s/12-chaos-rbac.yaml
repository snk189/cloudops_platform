apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: websocket-chaos-role
rules:
- apiGroups: ["", "apps", "extensions"]
  resources: ["pods", "deployments", "statefulsets", "services", "nodes", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec", "pods/log"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: websocket-chaos-binding-correct
  namespace: websocket-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: websocket-chaos-role
subjects:
- kind: ServiceAccount
  name: app-service-account
  namespace: websocket-app
